<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Augmented Automation</title>
  <link rel="icon" type="image/x-icon" href="/static/robot.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #ffffff;
      color: #000000;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #ddd;
    }

    header img { height: 56px; width: auto; border-radius: 4px; }

    .header-titles { flex: 1; }
    .header-titles h1 {
      font-family: "Bookman Old Style", "URW Bookman", Georgia, serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #000000;
    }
    .header-titles p { font-size: 0.7rem; color: #555; margin-top: 2px; }

    select {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .hdr-btn {
      background: #f0f0f0;
      color: #000000;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .hdr-btn:hover { background: #e0e0e0; }


    #main { display: flex; flex: 1; overflow: hidden; }

    #chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .message {
      width: 100%;
      padding: 16px 24px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user {
      background: #eef4ff;
      color: #000000;
      border-bottom: 1px solid #d8e6f7;
    }

    .message.assistant {
      background: #ffffff;
      color: #000000;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .message.assistant .avatar {
      height: 28px;
      width: 28px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .message.assistant .assistant-content { flex: 1; min-width: 0; }

    .message.error {
      background: #fdeaea;
      color: #a12626;
      font-size: 0.85rem;
      border-bottom: 1px solid #e0a0a0;
      padding: 8px 24px;
    }

    .message-text { white-space: pre-wrap; }

    .code-block {
      background: #1a1a1a;
      border-radius: 8px;
      margin: 8px 0;
      overflow: hidden;
      font-size: 0.82rem;
      border: 1px solid #333;
    }

    .code-lang {
      background: #2a2a2a;
      padding: 3px 10px;
      font-size: 0.72rem;
      color: #888;
      font-family: monospace;
      border-bottom: 1px solid #333;
    }

    .code-block pre { padding: 10px 12px; overflow-x: auto; margin: 0; }
    .code-block code { font-family: 'Courier New', Courier, monospace; color: #c9d1d9; white-space: pre; }

    .thinking {
      align-self: flex-start;
      color: #888;
      font-size: 0.85rem;
      font-style: italic;
      padding: 4px 4px;
    }

    #input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #ffffff;
      border-top: 1px solid #ddd;
    }

    #user-input {
      flex: 1;
      background: #ffffff;
      color: #000000;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      max-height: 140px;
    }

    #user-input:focus { outline: none; border-color: #4a9eff; }

    #send-btn {
      background: #30d158;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: #25a244; }
    #send-btn:disabled { background: #1a5c30; cursor: not-allowed; }

    /* About modal */
    #about-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #about-overlay.open { display: flex; }
    #about-box {
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 28px 32px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #about-box h2 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; color: #0f3460; }
    #about-box p { font-size: 0.9rem; line-height: 1.6; color: #333; }
    #about-box button {
      margin-top: 12px;
      align-self: flex-end;
      background: #f0f0f0;
      color: #000000;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 18px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #about-box button:hover { background: #e0e0e0; }
  </style>
</head>
<body>

<div id="about-overlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div id="about-box">
    <h2>About : AA1 Augmented Automation</h2>
    <p><strong>Version:</strong> 1.0 </p>
    <p><strong>Built by:</strong> Campbell Pateson</p>
    <p><strong>Contact:</strong> campbell1@fastmail.com.au </p>
    <button onclick="document.getElementById('about-overlay').classList.remove('open')">Close</button>
  </div>
</div>

<header>
  <img src="/static/J7.png" alt="Logo">
  <div class="header-titles">
    <h1>AA1 Augmented Automation</h1>
    <p>This is a basic interface into your local LLM</p>
  </div>
  <select id="model-select"><option value="">Loading models…</option></select>
  <button class="hdr-btn" onclick="saveChat()">Save</button>
  <button class="hdr-btn" onclick="clearChat()">Clear</button>
  <button class="hdr-btn" onclick="document.getElementById('about-overlay').classList.add('open')">About</button>
</header>

<div id="main">
  <div id="chat-area">
    <div id="messages"></div>
    <div id="input-row">
      <textarea id="user-input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
  const history = [];

  async function loadModels() {
    const sel = document.getElementById("model-select");
    try {
      const res = await fetch("/api/models");
      const data = await res.json();
      if (!data.models || data.models.length === 0) {
        sel.innerHTML = '<option value="">No models found</option>';
        return;
      }
      sel.innerHTML = data.models.map(m => `<option value="${m}">${m}</option>`).join("");
    } catch {
      sel.innerHTML = '<option value="">Error loading models</option>';
    }
  }

  function renderContent(text) {
    const container = document.createDocumentFragment();
    const parts = text.split(/(```[^\n]*\n[\s\S]*?```)/g);

    parts.forEach(part => {
      const codeMatch = part.match(/^```([^\n]*)\n([\s\S]*?)```$/);
      if (codeMatch) {
        const lang = codeMatch[1].trim();
        const code = codeMatch[2];
        const wrapper = document.createElement("div");
        wrapper.className = "code-block";
        if (lang) {
          const label = document.createElement("div");
          label.className = "code-lang";
          label.textContent = lang;
          wrapper.appendChild(label);
        }
        const pre = document.createElement("pre");
        const codeEl = document.createElement("code");
        codeEl.textContent = code;
        pre.appendChild(codeEl);
        wrapper.appendChild(pre);
        container.appendChild(wrapper);
      } else if (part) {
        const span = document.createElement("span");
        span.className = "message-text";
        span.textContent = part;
        container.appendChild(span);
      }
    });

    return container;
  }

  function appendMessage(role, content) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    if (role === "assistant") {
      const avatar = document.createElement("img");
      avatar.className = "avatar";
      avatar.src = "/static/J7.png";
      avatar.alt = "Assistant";
      div.appendChild(avatar);

      const contentDiv = document.createElement("div");
      contentDiv.className = "assistant-content";
      contentDiv.appendChild(renderContent(content));
      div.appendChild(contentDiv);
    } else {
      div.textContent = content;
    }
    document.getElementById("messages").appendChild(div);
    div.scrollIntoView({ behavior: "smooth" });
    return div;
  }

  function saveChat() {
    if (history.length === 0) { alert("Nothing to save."); return; }
    const lines = history.map(m => {
      const label = m.role === "user" ? "You" : "Assistant";
      return `[${label}]\n${m.content}`;
    });
    const text = lines.join("\n\n---\n\n");
    const timestamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    const filename = `chat-${timestamp}.txt`;
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function clearChat() {
    history.length = 0;
    document.getElementById("messages").innerHTML = "";
  }

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    const model = document.getElementById("model-select").value;
    if (!model) { alert("No model selected."); return; }

    input.value = "";
    input.style.height = "auto";

    appendMessage("user", text);
    history.push({ role: "user", content: text });

    const btn = document.getElementById("send-btn");
    btn.disabled = true;

    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Thinking…";
    document.getElementById("messages").appendChild(thinking);
    thinking.scrollIntoView({ behavior: "smooth" });

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model, messages: history, system: "" }),
      });

      thinking.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        appendMessage("error", `Error: ${err.detail || res.statusText}`);
        history.pop();
        return;
      }

      const data = await res.json();
      const reply = data.content;
      history.push({ role: "assistant", content: reply });
      appendMessage("assistant", reply);
    } catch (e) {
      thinking.remove();
      appendMessage("error", `Network error: ${e.message}`);
      history.pop();
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  document.getElementById("user-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  loadModels();
</script>
</body>
</html>
